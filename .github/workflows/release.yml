name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0). Required for manual run.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

defaults:
  run:
    working-directory: app/android

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # working-directory: app/android がステップ既定なので、そのディレクトリが存在する
      # checkout より前には（cdが必要な）シェルステップを置かない
      - name: Checkout code
        uses: actions/checkout@v7

      # tag push / workflow_dispatch のどちらでも、シェル組み込みの $GITHUB_REF_NAME を
      # 唯一の情報源にしてタグを解決する（${{ }} 式の inputs 参照は経路によって欠落することがあるため使わない）
      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          TAG="$INPUT_TAG_NAME"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          echo "Resolved release tag: '$TAG' (event=$GITHUB_EVENT_NAME, ref_type=$GITHUB_REF_TYPE, ref_name=$GITHUB_REF_NAME, input=$INPUT_TAG_NAME)"
          if [ -z "$TAG" ]; then
            echo "::error::tag_name is required (workflow_dispatch was run without a tag_name input and not against a tag ref)"
            exit 1
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: '$TAG' (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify fixed keystore
        run: |
          if [ ! -s ci/debug.keystore ]; then
            echo "ERROR: app/android/ci/debug.keystore not found or empty"
            echo "Run Android CI once first so the fixed keystore is generated and committed."
            exit 1
          fi

          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

          keytool -list \
            -keystore ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build signed Release APK
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK not found"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: app/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 最新ビルドのAPKだけを残し、過去のAPK artifactを削除する（GitHub Releasesは削除しない）
      - name: Delete previous APK artifacts
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const names = new Set(['app-debug', 'app-release-signed']);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const a of artifacts) {
              if (!names.has(a.name) || a.expired) continue;
              if (a.workflow_run && a.workflow_run.id === context.runId) continue;
              core.info(`Deleting artifact ${a.name} (#${a.id}) from run ${a.workflow_run ? a.workflow_run.id : '?'}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
              });
            }
