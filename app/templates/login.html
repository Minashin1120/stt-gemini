{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title mb-3">ログイン</h3>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="display:none;"><input type="text" name="_honey_field"></div>
            <div class="mb-3">
                <label>ユーザー名</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <!-- Cloudflare Turnstile -->
            <div class="cf-turnstile mb-3" data-sitekey="{{ turnstile_site_key }}"></div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">ログイン</button>
            <div class="text-center">
                <a href="/request_unlock" class="text-decoration-none small text-danger">アカウントがロックされましたか？ 解除を申請する</a>
            </div>
        </form>
    </div>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
