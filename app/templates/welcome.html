<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3.0 文字起こし - 高性能AI議事録ツール</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 100px 0; }
        .feature-icon { font-size: 3rem; color: #764ba2; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-4">AI 文字起こし Pro</h1>
            <p class="lead mb-5">Gemini 3.0 Flash Previewの圧倒的な推論能力で、<br>あなたの声を正確にテキスト化します。</p>
            <div>
                <a href="/login" class="btn btn-light btn-lg px-5 me-3">ログイン</a>
                <a href="/register" class="btn btn-outline-light btn-lg px-5">新規登録</a>
            </div>
        </div>
    </div>
    <div class="container py-5">
        <div class="row g-4 text-center">
            <div class="col-md-4">
                <i class="bi bi-cpu feature-icon"></i>
                <h3>高度な推論</h3>
                <p>AIが文脈を読み取り、同音異義語も正しく変換。推論プロセスも確認可能です。</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-magic feature-icon"></i>
                <h3>テキスト改善</h3>
                <p>起こしたテキストに対して「要約して」「丁寧にして」と指示するだけでAIが書き換えます。</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-shield-lock feature-icon"></i>
                <h3>安全な管理</h3>
                <p>APIキーは暗号化保存され、音声ファイルは10分後にサーバーから自動消去されます。</p>
            </div>
        </div>
    </div>
</body>
</html>
