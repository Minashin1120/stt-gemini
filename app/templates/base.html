<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Voxcribe | AI 文字起こし{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" integrity="sha384-QuGBSgV5Im3DzL2z+8Ko9/hqNy/N0O7zwvXAtfd1MvPKWa/UbeLV65cfm4BV5Wgq" crossorigin="anonymous">
    <!-- Google Fonts for Themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Old+Mincho&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css?v=4" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" defer></script>
    <script>
        // JS Challenge: 動的にフォームへトークンを注入 (自動化対策)
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('form');
            const csrf = document.querySelector('meta[name="csrf-token"]').content;
            forms.forEach(f => {
                if (f.method.toUpperCase() === 'POST') {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_js_challenge';
                    input.value = 'valid_' + csrf;
                    f.appendChild(input);
                }
            });
        });

        // テーマ初期化
        (function() {
            const savedTheme = localStorage.getItem('app_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body class="app-body">
    <div class="ambient-orb ambient-orb-one" aria-hidden="true"></div>
    <div class="ambient-orb ambient-orb-two" aria-hidden="true"></div>
    <div class="container app-shell">
        <nav class="navbar navbar-expand-lg app-navbar mb-4">
            <div class="container-fluid">
                <a class="navbar-brand brand-lockup" href="/">
                    <span class="brand-mark"><i class="bi bi-soundwave"></i></span>
                    <span><strong>Voxcribe</strong><small>AI Transcription</small></span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavigation" aria-controls="appNavigation" aria-expanded="false" aria-label="ナビゲーションを開く"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="appNavigation">
                <div class="navbar-nav ms-auto align-items-lg-center">
                    {% if current_user.is_authenticated %}
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="bi bi-grid-1x2"></i><span>ワークスペース</span></a>
                        <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings"><i class="bi bi-sliders"></i><span>設定</span></a>
                        <form method="POST" action="/logout" class="d-inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="nav-link border-0 bg-transparent"><i class="bi bi-box-arrow-right"></i><span>ログアウト</span></button>
                        </form>
                    {% else %}
                        <a class="nav-link {% if request.path == '/login' %}active{% endif %}" href="/login"><i class="bi bi-box-arrow-in-right"></i><span>ログイン</span></a>
                        <a class="btn btn-primary nav-cta" href="/register">無料で始める</a>
                    {% endif %}
                </div>
                </div>
            </div>
        </nav>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info app-alert" role="status">
                    <i class="bi bi-info-circle-fill"></i>
                    <div>
                    {% for message in messages %}{{ message }}<br>{% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endwith %}
        
        <main class="page-content">{% block content %}{% endblock %}</main>
    </div>
</body>
</html>
