<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Gemini AI 文字起こし</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" integrity="sha384-QuGBSgV5Im3DzL2z+8Ko9/hqNy/N0O7zwvXAtfd1MvPKWa/UbeLV65cfm4BV5Wgq" crossorigin="anonymous">
    <!-- Google Fonts for Themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Zen+Old+Mincho&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css?v=3" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" defer></script>
    <style>
        body { padding-top: 20px; }
        .container { max-width: 800px; }
        .recording-indicator { color: red; animation: blink 1s infinite; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
    <script>
        // JS Challenge: 動的にフォームへトークンを注入 (自動化対策)
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('form');
            const csrf = document.querySelector('meta[name="csrf-token"]').content;
            forms.forEach(f => {
                if (f.method.toUpperCase() === 'POST') {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_js_challenge';
                    input.value = 'valid_' + csrf;
                    f.appendChild(input);
                }
            });
        });

        // テーマ初期化
        (function() {
            const savedTheme = localStorage.getItem('app_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">AI 文字起こし</a>
                <div class="navbar-nav ms-auto">
                    {% if current_user.is_authenticated %}
                        <a class="nav-link" href="/">ホーム</a>
                        <a class="nav-link" href="/settings">設定</a>
                        <form method="POST" action="/logout" class="d-inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="nav-link border-0 bg-transparent">ログアウト</button>
                        </form>
                    {% else %}
                        <a class="nav-link" href="/login">ログイン</a>
                        <a class="nav-link" href="/register">登録</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">
                    {% for message in messages %}{{ message }}<br>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
