{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
    .thought-content { font-family: monospace; font-size: 0.85em; background-color: #f1f3f5; white-space: pre-wrap; max-height: 200px; overflow-y: auto; padding: 10px; border-radius: 5px; }
    #audioVisualizer { width: 100%; height: 80px; background-color: rgba(0,0,0,0.05); border-radius: 5px; display: none; margin-bottom: 15px; }
    html[data-theme="gaming"] #audioVisualizer { background-color: rgba(0,0,0,0.5); border: 1px solid var(--primary-color); box-shadow: var(--visualizer-glow); }
    
    .upload-area { border: 2px dashed #dee2e6; transition: border-color .3s, background-color .3s; cursor: pointer; }
    .upload-area:hover { border-color: var(--primary-color); background-color: rgba(0,0,0,0.02); }
    .upload-area.drag-over { border-color: var(--primary-color); background-color: rgba(0,0,0,0.05); }
    html[data-theme="gaming"] .upload-area { border-color: #333; }
    html[data-theme="gaming"] .upload-area:hover { border-color: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }
    
    .nav-pills .nav-link { font-weight: bold; padding: 10px 20px; color: #666; }
    .nav-pills .nav-link.active { background-color: var(--primary-color); color: white; }

    /* 履歴エリア用スタイル */
    .history-item { border-left: 4px solid var(--primary-color); margin-bottom: 1rem; background-color: var(--card-bg); padding: 10px; border-radius: 4px; box-shadow: var(--shadow); }
    .history-item.expired { border-left-color: gray; opacity: 0.7; }
    .history-meta { font-size: 0.75em; color: gray; display: flex; justify-content: space-between; }
    .history-thought { font-size: 0.8em; color: #666; border-left: 2px solid #ccc; padding-left: 8px; margin: 5px 0; max-height: 60px; overflow: hidden; cursor: pointer; }
    .history-thought.expanded { max-height: none; }
    .cursor-pointer { pointer: pointer; }
</style>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000">
    <div id="liveToast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- モーダル類 -->
<div class="modal fade" id="deleteModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>音声破棄</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">音声を削除しますか？<br><small class="text-danger">再分析不可になります。</small></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button><button class="btn btn-danger" id="confirmDeleteBtn">削除</button></div></div></div></div>

<div class="modal fade" id="fileManagerModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">保存データ (10分保持)</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="alert alert-info py-1 mb-2" style="font-size: 0.8rem;"><i class="bi bi-info-circle me-1"></i>保存データは文字起こし結果に影響します。</div><div id="fileListContainer" class="list-group list-group-flush"></div></div><div class="modal-footer"><button class="btn btn-primary" onclick="loadFileMetadata()">更新</button></div></div></div></div>

<div class="modal fade" id="wordSetModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">単語リストの有効化</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="d-flex justify-content-between align-items-center mb-3"><p class="small text-muted mb-0">使用する単語セットにチェックを入れてください。</p><button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetWordSets()">選択リセット</button></div><div id="wordSetListContainer" class="list-group list-group-flush"></div></div><div class="modal-footer"><button type="button" class="btn btn-sm btn-link me-auto" onclick="openWordSetManageModal()">リストの編集・作成</button><button class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button></div></div></div></div>

        <div class="modal-content">

                <h5 class="modal-title">単語リスト管理</h5>

<script>
// --- Global Utilities ---
function showToast(m, e=false) {
    const msgEl = document.getElementById('toastMessage');
    const toastEl = document.getElementById('liveToast');
    if (msgEl && toastEl) {
        msgEl.innerText = m;
        toastEl.classList.toggle('bg-danger', e);
        bootstrap.Toast.getOrCreateInstance(toastEl).show();
    }
}

const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function csrfFetch(input, init = {}) {
    const headers = new Headers(init.headers || {});
    if (csrfToken && !headers.has('X-CSRFToken')) {
        headers.set('X-CSRFToken', csrfToken);
    }
    
    // JS Challenge injection for fetch
    const method = (init.method || 'GET').toUpperCase();
    if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        if (init.body instanceof FormData) {
            if (!init.body.has('_js_challenge')) {
                init.body.append('_js_challenge', 'valid_' + csrfToken);
            }
        } else if (typeof init.body === 'string') {
            try {
                const obj = JSON.parse(init.body);
                obj._js_challenge = 'valid_' + csrfToken;
                init.body = JSON.stringify(obj);
            } catch (e) {
                // Not JSON, skip or handle as URLSearchParams if needed
            }
        }
    }
    
    return fetch(input, { ...init, headers });
}

// --- Word Set Manager (Global Scope) ---
window.loadWordSetStatus = async function() {
    const container = document.getElementById('wordSetListContainer');
    if (!container) return;
    container.innerHTML = '<div class="text-center py-2">読み込み中...</div>';
    try {
        const r = await csrfFetch('/api/word_sets');
        const sets = await r.json();
        updateWordSetButtonText(sets);
        if (sets.length === 0) {
            container.innerHTML = '<div class="text-center py-3 text-muted">セットがありません。<br><button type="button" class="btn btn-sm btn-link p-0 align-baseline" onclick="openWordSetManageModal()">新しく作成</button></div>';
            return;
        }
        container.innerHTML = sets.map(s => `
            <div class="list-group-item d-flex justify-content-between align-items-center p-2">
                <span class="fw-bold">${escapeHtml(s.name)}</span>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary p-1 lh-1" onclick="openWordSetEditModal(${s.id})" title="編集">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="ws_${s.id}" ${s.is_active ? 'checked' : ''} onchange="toggleWordSet(${s.id})">
                    </div>
                </div>
            </div>
        `).join('');
    } catch(e) { container.innerHTML = 'エラー'; }
};

window.toggleWordSet = async function(id) {
    try {
        const r = await csrfFetch(`/api/word_sets/toggle/${id}`, {method:'POST'});
        if(r.ok) { 
            showToast("単語セットの有効/無効を切り替えました");
            const r2 = await csrfFetch('/api/word_sets');
            const sets = await r2.json();
            updateWordSetButtonText(sets);
        } else {
            showToast("切り替え失敗", true);
        }
    } catch(e){ showToast("通信エラー", true); }
};

window.resetWordSets = async function() {
    try {
        const r = await csrfFetch('/api/word_sets/reset', {method:'POST'});
        if(r.ok) {
            showToast("すべてのセットを無効化しました");
            loadWordSetStatus(); // リストとボタン両方を更新
        }
    } catch(e) { showToast("通信エラー", true); }
};

// --- Word Set Management Modal Logic ---
let currentManageSetId = "";
window.openWordSetEditModal = async function(setId) {
    const manageModal = new bootstrap.Modal(document.getElementById('wordSetManageModal'));
    const activationModal = bootstrap.Modal.getInstance(document.getElementById('wordSetModal'));
    if (activationModal) activationModal.hide();
    manageModal.show();
    await refreshManageList(setId.toString());
};

window.openWordSetManageModal = async function() {
    const manageModal = new bootstrap.Modal(document.getElementById('wordSetManageModal'));
    const activationModal = bootstrap.Modal.getInstance(document.getElementById('wordSetModal'));
    if (activationModal) activationModal.hide();
    manageModal.show();
    await refreshManageList(currentManageSetId);
};

async function refreshManageList(selectedId = "") {
    const container = document.getElementById('wordSetsManageContainer');
    const selector = document.getElementById('manageSetSelector');
    
    // 1. セット一覧 (JSON) を取得してセレクターを更新
    const resSets = await csrfFetch('/api/word_sets');
    const sets = await resSets.json();
    selector.innerHTML = '<option value="">-- 管理するセットを選択してください --</option>' + 
        sets.map(s => `<option value="${s.id}" ${s.id == selectedId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
    
    // 2. 管理用HTML (Partial) を取得してコンテナを更新
    const resHtml = await csrfFetch('/api/word_sets/manage_html');
    const html = await resHtml.text(); 
    container.innerHTML = html;

    currentManageSetId = selectedId.toString();
    updateManageVisibility();
}

function updateManageVisibility() {
    const container = document.getElementById('wordSetsManageContainer');
    const cards = container.querySelectorAll('.word-set-card');
    cards.forEach(card => {
        card.style.display = (card.dataset.id === currentManageSetId) ? 'block' : 'none';
    });
}

// モーダル内のイベントリスナー設定
document.addEventListener('DOMContentLoaded', () => {
    const selector = document.getElementById('manageSetSelector');
    const container = document.getElementById('wordSetsManageContainer');

    selector.addEventListener('change', () => {
        currentManageSetId = selector.value;
        updateManageVisibility();
    });

    document.getElementById('createSetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await csrfFetch('/api/word_sets/create', { method: 'POST', body: formData });
        if (res.ok) {
            const data = await res.json();
            e.target.reset();
            await refreshManageList(data.id);
        }
    });

    container.addEventListener('click', async (e) => {
        const target = e.target;
        if (target.closest('.delete-set-btn')) {
            if (!confirm('このセットを削除しますか？')) return;
            const id = target.closest('.delete-set-btn').dataset.id;
            await csrfFetch(`/api/word_sets/delete/${id}`, { method: 'POST' });
            await refreshManageList("");
        }
        if (target.closest('.delete-word-btn')) {
            const id = target.closest('.delete-word-btn').dataset.id;
            await csrfFetch(`/api/words/delete/${id}`, { method: 'POST' });
            await refreshManageList(currentManageSetId);
        }
    });

    container.addEventListener('submit', async (e) => {
        if (e.target.classList.contains('add-word-form')) {
            e.preventDefault();
            const formData = new FormData(e.target);
            await csrfFetch('/api/words/add', { method: 'POST', body: formData });
            await refreshManageList(currentManageSetId);
        }
    });
});

function updateWordSetButtonText(sets) {
    const btn = document.getElementById('btnWordSet');
    if (!btn) return;
    const activeNames = sets.filter(s => s.is_active).map(s => s.name);
    if (activeNames.length > 0) {
        btn.innerHTML = `<i class="bi bi-journal-check"></i> ${escapeHtml(activeNames.join(', '))}`;
        btn.classList.remove('btn-outline-primary');
        btn.classList.add('btn-primary', 'text-white');
    } else {
        btn.innerHTML = `<i class="bi bi-journal-text"></i> 単語リスト`;
        btn.classList.remove('btn-primary', 'text-white');
        btn.classList.add('btn-outline-primary');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    let selectedFile = null, mediaRecorder, audioContext, processor, microphone, mp3Encoder, audioStream, isRecording = false, isPaused = false, isAppendMode = false, initText = "", audioChunks = [];
    let abortController = null;

    // UI Elements
    const canvas = document.getElementById("audioVisualizer"), ctx = canvas.getContext("2d");
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('audioFileInput');
    const fileInfo = document.getElementById('fileSelectionInfo');
    const fileNameEl = document.getElementById('selectedFileName');
    const fileSizeEl = document.getElementById('selectedFileSize');
    const removeFileBtn = document.getElementById('btnRemoveFile');
    const btnUploadNew = document.getElementById('btnUploadNew');
    const btnUploadAppend = document.getElementById('btnUploadAppend');

    const bsDelModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    const thoughtCol = new bootstrap.Collapse(document.getElementById('collapseThinking'), {toggle:false});
    
    const el = {
        recNew: document.getElementById('btnRecordNew'), recAdd: document.getElementById('btnRecordAppend'),
        pause: document.getElementById('btnPause'), stop: document.getElementById('btnStop'), cancel: document.getElementById('btnCancel'),
        copy: document.getElementById('btnCopy'), imp: document.getElementById('btnImprove'), stat: document.getElementById('status'),
        res: document.getElementById('resultText'), tho: document.getElementById('thoughtText'),
        ins: document.getElementById('instructionInput'), think: document.getElementById('thinking_level'),
        noise: document.getElementById('noiseSuppression'), rephrase: document.getElementById('allowRephraseCorrection'), useAudio: document.getElementById('useAudioForImprove'),
        re: document.getElementById('btnReanalyze'), delBtn: document.getElementById('btnOpenDel'),
        hist: document.getElementById('historyContainer'), reset: document.getElementById('btnReset'),
        abort: document.getElementById('btnAbort')
    };

    el.abort.onclick = () => {
        if (abortController) {
            abortController.abort();
            el.stat.innerText = "停止されました";
            el.abort.classList.add('d-none');
            showToast("処理を停止しました");
        }
    };

    function getModel() {
        const checked = document.querySelector('input[name="model_select"]:checked');
        return checked ? checked.value : 'gemini-3-flash-preview';
    }
    function saveSet(){ 
        localStorage.setItem('stt_t', el.think.value);
        if(el.noise) localStorage.setItem('stt_n', el.noise.checked);
        if(el.rephrase) localStorage.setItem('stt_r', el.rephrase.checked);
        const fmt = document.querySelector('input[name="format"]:checked');
        if(fmt) localStorage.setItem('stt_f', fmt.value);
        localStorage.setItem('stt_m', getModel());
    }
    
    const t=localStorage.getItem('stt_t'), n=localStorage.getItem('stt_n'), rephraseSaved=localStorage.getItem('stt_r'), f=localStorage.getItem('stt_f'), m=localStorage.getItem('stt_m');
    if(t) el.think.value=t;
    if(n!==null && el.noise) el.noise.checked=(n==='true');
    if(rephraseSaved!==null && el.rephrase) el.rephrase.checked=(rephraseSaved==='true');
    if(f) { const r = document.querySelector(`input[name="format"][value="${f}"]`); if(r) r.checked=true; }
    if(m) { const r = document.querySelector(`input[name="model_select"][value="${m}"]`); if(r) r.checked=true; }
    
    el.think.addEventListener('change', saveSet);
    if(el.noise) el.noise.addEventListener('change', saveSet);
    if(el.rephrase) el.rephrase.addEventListener('change', saveSet);
    document.querySelectorAll('input[name="format"]').forEach(r=>r.addEventListener('change', saveSet));
    document.querySelectorAll('input[name="model_select"]').forEach(r=>r.addEventListener('change', saveSet));
    
    loadHistory(); 
    loadWordSetStatus();

    // --- File Upload UI Logic ---
    function handleFileSelect(file) {
        if (!file) return;
        if (!file.type.startsWith('audio/') && !file.name.toLowerCase().endsWith('.mp3') && !file.name.toLowerCase().endsWith('.wav') && !file.name.toLowerCase().endsWith('.m4a')) {
            showToast("音声ファイルを選択してください", true);
            return;
        }
        selectedFile = file;
        fileNameEl.innerText = file.name;
        fileSizeEl.innerText = (file.size / (1024 * 1024)).toFixed(2) + " MB";
        fileInfo.classList.remove('d-none');
        btnUploadNew.disabled = false;
        btnUploadAppend.disabled = false;
        el.stat.innerText = "ファイルが選択されました";
    }

    dropArea.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFileSelect(e.target.files[0]);

    dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('drag-over'); };
    dropArea.ondragleave = () => dropArea.classList.remove('drag-over');
    dropArea.ondrop = (e) => {
        e.preventDefault();
        dropArea.classList.remove('drag-over');
        handleFileSelect(e.dataTransfer.files[0]);
    };

    removeFileBtn.onclick = (e) => {
        e.stopPropagation();
        selectedFile = null;
        fileInput.value = "";
        fileInfo.classList.add('d-none');
        btnUploadNew.disabled = true;
        btnUploadAppend.disabled = true;
        el.stat.innerText = "準備完了";
    };

    // --- History Functions ---
    async function loadHistory() {
        try {
            const r = await csrfFetch('/api/history');
            const data = await r.json();
            if(data.length === 0) { el.hist.innerHTML = '<div class="text-center text-muted small py-3">履歴なし</div>'; return; }
            
            el.hist.innerHTML = data.map(h => `
                <div class="history-item ${h.expired ? 'expired' : ''}">
                    <div class="history-meta">
                        <span>${escapeHtml(h.action.toUpperCase())}</span>
                        <div>
                            <span class="me-2">${escapeHtml(h.time)}</span>
                            <i class="bi bi-trash text-danger cursor-pointer" onclick="deleteHistoryItem(${h.id})" title="削除"></i>
                        </div>
                    </div>
                    ${h.input ? `<div class="small fw-bold text-truncate">${escapeHtml(h.input)}</div>` : ''}
                    ${h.thought ? `<div class="history-thought" onclick="this.classList.toggle('expanded')" title="クリックで展開">${escapeHtml(h.thought.substring(0,50))}${h.thought.length > 50 ? '...' : ''}</div>` : ''}
                    <div class="small mt-1" style="white-space:pre-wrap;">${h.result ? `${escapeHtml(h.result.substring(0, 100))}${h.result.length>100?'...':''}` : '(結果なし)'}</div>
                </div>
            `).join('');
        } catch(e){}
    }

    window.deleteHistoryItem = async (id) => {
        if(!confirm('この履歴を削除しますか？')) return;
        try {
            const r = await csrfFetch(`/api/delete_history/${id}`, {method:'POST'});
            if(r.ok) { showToast("履歴を削除しました"); loadHistory(); }
        } catch(e){ showToast("削除失敗", true); }
    };

    el.reset.onclick = async () => {
        if(!confirm('すべての履歴と保存データを削除して、完全に新しいセッションを開始しますか？')) return;
        try {
            const r = await csrfFetch('/api/clear_all', {method:'POST'});
            if(r.ok) {
                showToast("セッションと保存データをリセットしました");
                el.res.value = "";
                el.tho.innerText = "";
                el.re.disabled = el.delBtn.disabled = true;
                loadHistory();
            } else {
                showToast("リセットに失敗しました", true);
            }
        } catch(e) { showToast("通信エラー", true); }
    };

    // --- File Manager ---
    window.loadFileMetadata = async function() {
        const c = document.getElementById('fileListContainer'); c.innerHTML = 'Loading...';
        try {
            const r = await csrfFetch('/api/files'); const files = await r.json();
            c.innerHTML = files.length ? files.map(f => `
                <div class="list-group-item d-flex justify-content-between align-items-center p-2">
                    <div class="flex-grow-1 me-2"><div class="small fw-bold">${escapeHtml(f.display_name)}</div><audio controls src="${escapeHtml(f.url)}" style="height:25px;width:100%"></audio></div>
                    <button class="btn btn-outline-danger btn-sm delete-file-btn" data-filename="${escapeHtml(f.filename)}"><i class="bi bi-trash"></i></button>
                </div>`).join('') : '<div class="text-center py-2 text-muted">保存された音声はありません</div>';
        } catch(e){ c.innerHTML='エラー'; }
    };

    window.deleteFileItem = async (filename) => {
        if(!confirm('このファイルを削除しますか？')) return;
        try {
            const r = await csrfFetch(`/api/delete_file/${filename}`, {method:'POST'});
            if(r.ok) { showToast("ファイルを削除しました"); loadFileMetadata(); }
        } catch(e){ showToast("削除失敗", true); }
    };
    document.getElementById('fileListContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('.delete-file-btn');
        if (btn) {
            deleteFileItem(btn.dataset.filename);
        }
    });

    // --- Visualizer & Audio ---
    function vis(s){
        if(!audioContext) audioContext=new AudioContext();
        const src=audioContext.createMediaStreamSource(s), ana=audioContext.createAnalyser();
        ana.fftSize=2048; src.connect(ana);
        const data=new Uint8Array(ana.frequencyBinCount);
        canvas.style.display="block";
        (function draw(){
            if(!isRecording) return;
            requestAnimationFrame(draw); ana.getByteTimeDomainData(data);
            ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.lineWidth=2; 
            const tm=document.documentElement.getAttribute('data-theme');
            ctx.strokeStyle = tm==='gaming' ? `hsl(${Date.now()/10%360},100%,50%)` : getComputedStyle(document.body).getPropertyValue('--primary-color');
            ctx.beginPath();
            let x=0, sw=canvas.width/data.length;
            const sensitivity = 8.0; 
            for(let i=0;i<data.length;i++){
                let v = ((data[i] - 128.0) * sensitivity / 128.0) + 1.0;
                let y = v * canvas.height / 2;
                if (y < 0) y = 0;
                if (y > canvas.height) y = canvas.height;
                i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); x+=sw;
            }
            ctx.stroke();
        })();
    }

    // --- Stream & Upload ---
    let sseBuffer = "";
    async function handleStreamResponse(r) {
        const reader=r.body.getReader(), dec=new TextDecoder();
        el.tho.innerText=""; 
        let streamHadError = false;
        let isAborted = false;

        if(!isAppendMode) {
            el.res.value="";
            initText="";
        }
        else { let cur=el.res.value.trim(); initText=cur?cur+"\n\n":""; el.res.value=initText; }
        
        if(el.think.value!=='MINIMAL') thoughtCol.show();
        el.abort.classList.remove('d-none');

        let stT="";
        sseBuffer = "";
        try {
            while(true){
                const {done,value}=await reader.read(); if(done)break;
                sseBuffer += dec.decode(value, {stream: true});
                const lines = sseBuffer.split('\n\n');
                sseBuffer = lines.pop();

                lines.forEach(l=>{
                    if(l.startsWith('data: ')){
                        try{
                            const d=JSON.parse(l.substring(6));
                            if(d.type==='thought'){ el.tho.innerText+=d.content; el.tho.scrollTop=el.tho.scrollHeight; }
                            else if(d.type==='text'){ stT+=d.content; el.res.value=initText+stT; el.res.scrollTop=el.res.scrollHeight; }
                            else if(d.type==='error') {
                                streamHadError = true;
                                showToast(d.content,true);
                            }
                        }catch(e){}
                    }
                });
            }
        } catch(e){
            if (e.name === 'AbortError') {
                isAborted = true;
            } else {
                streamHadError = true;
                showToast("Error",true);
            }
        }
        finally {
            el.abort.classList.add('d-none');
            if (isAborted) return;
            if (streamHadError) {
                el.stat.innerText="エラー";
                el.copy.disabled = true;
                el.re.disabled = true;
                el.delBtn.disabled = true;
                return;
            }
            el.stat.innerText="完了";
            el.copy.disabled=el.re.disabled=el.delBtn.disabled=false;
            showToast("完了");
            loadHistory();
            // Flash-Lite は LOW/MEDIUM で thought を返さないのでヒント表示
            const _mdl = getModel();
            const _lvl = el.think.value;
            if (_mdl === 'gemini-3.1-flash-lite' && (_lvl === 'LOW' || _lvl === 'MEDIUM') && !el.tho.innerText.trim()) {
                el.tho.innerText = '[Flash-Lite は LOW/MEDIUM 設定時に思考プロセスを返しません。表示するには HIGH を選択してください。]';
            }
        }
    }

    btnUploadNew.onclick = () => uploadFile(false);
    btnUploadAppend.onclick = () => uploadFile(true);

    async function uploadFile(append = false) {
        if (!selectedFile) return;
        isAppendMode = append;
        el.stat.innerText = "アップロード中...";
        btnUploadNew.disabled = btnUploadAppend.disabled = true;
        abortController = new AbortController();
        const fd = new FormData();
        fd.append('audio_file', selectedFile);
        fd.append('thinking_level', el.think.value);
        fd.append('model', getModel());
        fd.append('allow_rephrase_correction', el.rephrase && el.rephrase.checked ? '1' : '0');
        try {
            const r = await csrfFetch('/transcribe', { 
                method: 'POST', 
                body: fd,
                signal: abortController.signal
            });
            if (!r.ok) {
                const err = await r.json();
                showToast(err.error || "エラーが発生しました", true);
                el.stat.innerText = "エラー";
                return;
            }
            await handleStreamResponse(r);
        } catch (e) {
            if (e.name === 'AbortError') return;
            showToast("通信エラー", true);
            el.stat.innerText = "通信エラー";
        } finally {
            btnUploadNew.disabled = btnUploadAppend.disabled = false;
        }
    }

    async function rec(append=false) {
        isAppendMode=append; if(!append){el.tho.innerText="";el.res.value="";initText="";}
        el.copy.disabled=true; el.stat.innerText="準備中...";
        if(audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
        }

        try {
            const useProcessing = el.noise.checked;
            const constraints = {
                audio: {
                    echoCancellation: useProcessing,
                    noiseSuppression: useProcessing,
                    autoGainControl: useProcessing,
                    googEchoCancellation: useProcessing,
                    googAutoGainControl: useProcessing,
                    googNoiseSuppression: useProcessing,
                    googHighpassFilter: useProcessing
                }
            };
            
            audioStream = await navigator.mediaDevices.getUserMedia(constraints);
            isRecording=true; isPaused=false; vis(audioStream);
            const fmt=document.querySelector('input[name="format"]:checked').value;
            
            if(fmt==='mp3'){
                if(!audioContext) audioContext = new AudioContext();
                const sampleRate = audioContext.sampleRate;
                microphone = audioContext.createMediaStreamSource(audioStream);
                processor = audioContext.createScriptProcessor(8192, 1, 1);
                mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
                audioChunks = [];
                
                processor.onaudioprocess = e => {
                    if(isPaused) return;
                    const b = e.inputBuffer.getChannelData(0);
                    const d = new Int16Array(b.length);
                    for(let i=0; i<b.length; i++) {
                        let s = Math.max(-1, Math.min(1, b[i]));
                        d[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    const c = mp3Encoder.encodeBuffer(d);
                    if(c.length > 0) audioChunks.push(c);
                };
                microphone.connect(processor);
                processor.connect(audioContext.destination);
            } else {
                const recorderOptions = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                    ? { mimeType: 'audio/webm;codecs=opus' }
                    : {};
                mediaRecorder = new MediaRecorder(audioStream, recorderOptions);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => upl(new Blob(audioChunks,{type: mediaRecorder.mimeType || 'audio/webm'}), 'rec.webm');
                mediaRecorder.start();
            }
            el.recNew.disabled=el.recAdd.disabled=true; el.stop.disabled=el.pause.disabled=el.cancel.disabled=false;
            const noiseLabel = useProcessing ? '<span class="badge bg-primary ms-1">ノイズ除去: ON</span>' : '<span class="badge bg-secondary ms-1">ノイズ除去: OFF</span>';
            el.stat.innerHTML=`<span class="recording-indicator">● 録音中...</span> ${noiseLabel}`; showToast(`録音開始`);
        } catch(e){ el.stat.innerText="エラー"; showToast(e.message,true); }
    }

    el.recNew.onclick=()=>rec(false); el.recAdd.onclick=()=>rec(true);
    el.pause.onclick=()=>{
        isPaused=!isPaused;
        if(isPaused){ if(mediaRecorder)mediaRecorder.pause(); el.stat.innerText="一時停止"; el.pause.innerHTML='<i class="bi bi-play-fill"></i>';}
        else{ if(mediaRecorder)mediaRecorder.resume(); el.stat.innerHTML=`<span class="recording-indicator">● 録音中...</span>`; el.pause.innerHTML='<i class="bi bi-pause-fill"></i>';}
    };
    el.cancel.onclick=()=>{
        isRecording=false; isPaused=false;
        if(mediaRecorder){ mediaRecorder.onstop = null; mediaRecorder.stop(); }
        if(audioStream)audioStream.getTracks().forEach(t=>t.stop());
        if(audioContext)audioContext.close(); audioContext=null;
        audioChunks=[]; mp3Encoder=null;
        el.recNew.disabled=el.recAdd.disabled=false; el.stop.disabled=el.pause.disabled=el.cancel.disabled=true;
        el.stat.innerText="キャンセル"; showToast("キャンセルしました");
    };
    el.stop.onclick=()=>{
        isRecording=false; el.recNew.disabled=el.recAdd.disabled=false; el.stop.disabled=el.pause.disabled=el.cancel.disabled=true;
        el.stat.innerText="解析中...";
        if(mp3Encoder){
            microphone.disconnect(); processor.disconnect(); audioContext.close(); audioContext=null;
            const l=mp3Encoder.flush(); if(l.length>0)audioChunks.push(l); audioStream.getTracks().forEach(t=>t.stop());
            upl(new Blob(audioChunks,{type:'audio/mp3'}),'rec.mp3'); mp3Encoder=null;
        } else { mediaRecorder.stop(); audioStream.getTracks().forEach(t=>t.stop()); }
    };

    async function upl(b,n){
        abortController = new AbortController();
        const fd=new FormData(); fd.append('audio_file',b,n); fd.append('thinking_level',el.think.value); fd.append('model', getModel()); fd.append('allow_rephrase_correction', el.rephrase && el.rephrase.checked ? '1' : '0');
        try{
            const r=await csrfFetch('/transcribe',{
                method:'POST',
                body:fd,
                signal: abortController.signal
            });
            if(!r.ok){
                const err = await r.json().catch(() => ({}));
                showToast(err.error || "エラーが発生しました", true);
                el.stat.innerText = "エラー";
                return;
            }
            await handleStreamResponse(r);
        }catch(e){ if(e.name!=='AbortError') showToast("通信エラー",true); }
    }

    el.re.onclick=async()=>{
        isAppendMode=false;
        el.stat.innerText="再分析中...";
        abortController = new AbortController();
        try{ const r=await csrfFetch('/reanalyze',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({thinking_level:el.think.value,model:getModel(),allow_rephrase_correction:el.rephrase && el.rephrase.checked}),
            signal: abortController.signal
        });
        if(!r.ok){ showToast("エラー",true); return; } await handleStreamResponse(r); }catch(e){ if(e.name!=='AbortError') showToast("失敗",true); }
    };

    el.imp.onclick=async()=>{
        const t=el.res.value, i=el.ins.value; if(!t||!i){showToast("入力してください",true);return;}
        isAppendMode=false; el.stat.innerText="改善中..."; el.imp.disabled=true;
        abortController = new AbortController();
        try{
            const r=await csrfFetch('/improve',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({text:t,instruction:i,thinking_level:el.think.value,model:getModel(),use_audio:el.useAudio.checked}),
                signal: abortController.signal
            });
            if(!r.ok){
                const err = await r.json().catch(() => ({}));
                showToast(err.error || "エラーが発生しました", true);
                el.stat.innerText = "エラー";
                return;
            }
            await handleStreamResponse(r);
            el.ins.value="";
        } catch (e) {
            if (e.name !== 'AbortError') showToast("通信エラー", true);
        } finally{ el.imp.disabled=false; }
    };
    el.ins.onkeypress=e=>{if(e.key==='Enter')el.imp.click();};
    document.getElementById('confirmDeleteBtn').onclick=async()=>{
        bsDelModal.hide();
        try{ const r=await csrfFetch('/delete_audio',{method:'POST'}); if(r.ok){ showToast("削除しました"); el.stat.innerText="削除済み"; el.re.disabled=el.delBtn.disabled=true; } }catch(e){}
    };
    el.copy.onclick=()=>{ navigator.clipboard.writeText(el.res.value).then(()=>showToast("コピーしました")); };
});
</script>
