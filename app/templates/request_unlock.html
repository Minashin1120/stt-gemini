{% extends "base.html" %}
{% block title %}ロック解除 | Voxcribe{% endblock %}
{% block content %}
<div class="auth-layout">
<div class="card auth-card">
    <div class="card-body">
        <div class="auth-icon auth-icon-danger"><i class="bi bi-shield-exclamation"></i></div>
        <span class="eyebrow">Account recovery</span>
        <h1 class="auth-title">ロック解除申請</h1>
        <p class="small text-muted mb-4">不審な操作が検知されたため、アカウントが一時的に制限されています。解除を希望される場合は、ユーザー名を入力して申請してください。</p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="display:none;" aria-hidden="true">
                <input type="text" name="_honey_field" tabindex="-1" autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-control" placeholder="解除を希望するユーザー名" required>
            </div>
            
            <!-- Cloudflare Turnstile -->
            <div class="cf-turnstile mb-3" data-sitekey="{{ turnstile_site_key }}"></div>
            
            <button type="submit" class="btn btn-danger w-100">解除を申請する</button>
        </form>
        
        <div class="mt-3 text-center">
            <a href="/login" class="text-decoration-none small text-secondary">ログイン画面へ戻る</a>
        </div>
    </div>
</div>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
