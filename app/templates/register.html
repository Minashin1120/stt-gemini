{% extends "base.html" %}
{% block title %}新規登録 | Voxcribe{% endblock %}
{% block content %}
<div class="auth-layout">
<div class="card auth-card">
    <div class="card-body">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <span class="eyebrow">Get started</span>
        <h1 class="auth-title">アカウントを作成</h1>
        <p class="auth-lead">音声を、すぐに使える文章へ。</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="display:none;" aria-hidden="true">
                <input type="text" name="_honey_field" tabindex="-1" autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label">ユーザー名</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <!-- Cloudflare Turnstile -->
            <div class="cf-turnstile mb-3" data-sitekey="{{ turnstile_site_key }}"></div>
            
            <button type="submit" class="btn btn-primary w-100">登録する <i class="bi bi-arrow-right"></i></button>
        </form>
    </div>
</div>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
